<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SMS Event Photos</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Event Photo Feed</h1>
      <p>Photos and messages sent by SMS appear here automatically.</p>
      <p id="status" class="status">Loading latest messages…</p>
    </header>
    <main>
      <section id="feed" class="feed" aria-live="polite"></section>
    </main>
    <template id="entry-template">
      <article class="entry">
        <div class="entry-media-wrapper">
          <img class="entry-media" alt="" loading="lazy" />
        </div>
        <div class="entry-content">
          <p class="entry-message"></p>
          <div class="entry-meta">
            <span class="entry-phone"></span>
            <time class="entry-time"></time>
          </div>
        </div>
      </article>
    </template>
    <script src="./app.js" defer></script>
  </body>
</html>
